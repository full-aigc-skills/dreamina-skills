name: Dispatch Plugin Skill Sync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Released immutable version tag, for example v1.0.1
        required: true
        type: string
      sha:
        description: Optional expected peeled commit SHA
        required: false
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.FULL_AIGC_SKILLS_SYNC_TOKEN || secrets.SKILLS_SYNC_TOKEN }}
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
      REQUESTED_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity
        id: release
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::FULL_AIGC_SKILLS_SYNC_TOKEN is required"
            exit 1
          fi
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release ref: $RELEASE_REF"
            exit 1
          fi
          release_sha="$(git rev-list -n 1 "$RELEASE_REF")"
          if [[ -n "$REQUESTED_SHA" && "$REQUESTED_SHA" != "$release_sha" ]]; then
            echo "::error::Requested SHA does not match the release tag"
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Dispatch immutable release
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          for repo in \
            full-aigc-plugins/dreamina-canvas-plugin \
            full-aigc-plugins/dreamina-design-plugin; do
            gh api --method POST "repos/$repo/dispatches" \
              -f event_type=skills-updated \
              -F "client_payload[package]=dreamina-skills" \
              -F "client_payload[ref]=$RELEASE_REF" \
              -F "client_payload[sha]=$RELEASE_SHA"
          done
